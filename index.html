<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd6e7, #fff0f5);
  overflow: hidden;
}

.box {
  width: 90%;
  max-width: 500px;
  background: white;
  padding: 35px 20px;
  border-radius: 30px;
  text-align: center;
  box-shadow: 0 10px 35px rgba(0,0,0,.15);
}

.heart {
  font-size: 60px;
}

h1 {
  color: #e91e63;
  font-size: 27px;
}

p {
  color: #555;
  font-size: 19px;
  line-height: 1.5;
}

.area {
  position: relative;
  width: 100%;
  height: 220px;
  margin-top: 20px;
  overflow: hidden;
}

button {
  position: absolute;
  border: none;
  border-radius: 16px;
  color: white;
  font-size: 18px;
  font-weight: bold;
  touch-action: manipulation;
  transition: .3s;
}

#yes {
  background: #4caf50;
  width: 120px;
  height: 55px;
  left: 8%;
  top: 70px;
}

#no {
  background: #f44336;
  width: 115px;
  height: 55px;
  left: 58%;
  top: 70px;
}

</style>
</head>

<body>

<div class="box">

<div class="heart">🥺❤️</div>

<h1>Özür dilerim bitanemmm ❤️</h1>

<p id="text">
Fazla uyuduğum için özür dilerim bitanemmm 🥺<br>
Barışalım mı? ❤️
</p>

<div class="area" id="area">

<button id="yes">Evet ❤️</button>
<button id="no">Hayır 😒</button>

</div>
</div>

<script>

let count = 0;

const no = document.getElementById("no");
const yes = document.getElementById("yes");
const area = document.getElementById("area");
const text = document.getElementById("text");

const messages = [
"Emin misin bitanem? 🥺",
"Ama gerçekten özür diliyorum 😭❤️",
"Bir şans daha vermez misin? 👉👈",
"Tamam tamam, bir daha fazla uyumayacağım 😭",
"Beni böyle üzme bitanemmm 🥹",
"Hadi barışalım artık ❤️",
"Hayır butonu bile kaçıyor 😂",
"Bitanemmm lütfennn 🥺❤️",
"Bak Evet büyüyor 😭",
"Son kez soruyorum... ❤️"
];

no.addEventListener("click", function() {

count++;

text.innerHTML = messages[Math.min(count - 1, messages.length - 1)];


// EVET BÜYÜSÜN

yes.style.width = (120 + count * 12) + "px";
yes.style.height = (55 + count * 5) + "px";


// HAYIR KÜÇÜLSÜN

let w = Math.max(45, 115 - count * 7);
let h = Math.max(28, 55 - count * 3);

no.style.width = w + "px";
no.style.height = h + "px";

no.style.fontSize =
Math.max(9, 18 - count) + "px";


// YENİ RASTGELE YER

let maxX = area.clientWidth - no.offsetWidth;
let maxY = area.clientHeight - no.offsetHeight;

let x = Math.random() * maxX;
let y = Math.random() * maxY;

no.style.left = x + "px";
no.style.top = y + "px";


// 10 KEZDEN SONRA KAYBOLSUN

if(count >= 10) {

no.style.display = "none";

text.innerHTML =
"Artık sadece Evet kaldı 🥹❤️<br>Barışalım mı bitanemmm?";

}

});


// EVET

yes.addEventListener("click", function() {

document.querySelector(".heart").innerHTML = "🥰❤️";

document.querySelector("h1").innerHTML =
"Barıştık! ❤️";

text.innerHTML =
"Çok teşekkür ederim bitanemmm 🥹❤️<br>" +
"Bir daha fazla uyumayacağım. Seni çok seviyorum! 💕";

yes.style.display = "none";
no.style.display = "none";

});

</script>

</body>
</html>
